<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Diplomes</title>
</head>
<body>
    <h1>Liste des diplomes</h1>

    <form th:action="@{/graduates/export}" method="get">
        <label for="promotionId">Promotion</label>
        <select id="promotionId" name="promotionId">
            <option th:each="promotion : ${promotions}"
                    th:value="${promotion.id}"
                    th:text="${promotion.name}"></option>
        </select>

        <label for="parcours">Parcours</label>
        <select id="parcours" name="parcours">
            <option th:each="p : ${parcoursOptions}" th:value="${p}" th:text="${p}"></option>
        </select>

        <button type="submit">Telecharger la liste des diplomes</button>
    </form>

    <a th:href="@{/promotions}">Retour aux promotions</a>
</body>
</html>
