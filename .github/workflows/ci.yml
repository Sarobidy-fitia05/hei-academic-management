name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

  workflow_call:



jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:13.9
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      AWS_REGION: eu-west-3
      DATABASE_URL: jdbc:postgresql://localhost:5432/testdb
      DATABASE_USERNAME: test
      DATABASE_PASSWORD: test
      JWT_SECRET: test-secret-key-for-ci-only-not-a-real-secret-1234567890
      JWT_EXPIRATION_MS: 86400000
      S3_BUCKET_NAME: test-bucket
      EVENTBRIDGE_BUS_NAME: test-bus

    steps:
      - uses: actions/checkout@v4.1.6

      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Wait for Postgres to be ready
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U test; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for postgres..."
            sleep 2
          done

      - run: chmod +x gradlew
      - run: chmod +x .shell/publish_gen_to_maven_local.sh
      - run: |
          ./gradlew test



  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.1.6
      - uses: actions/setup-java@v4.2.1
        with:
          java-version: '21'
          distribution: 'corretto'

      - run: chmod +x format.sh
      - run: ./format.sh && git diff --exit-code